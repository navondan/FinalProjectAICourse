[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "novaops-company-brain"
version = "0.1.0"
description = "A permission-aware operational assistant for NovaOps"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "boto3>=1.35",
    "faiss-cpu>=1.8",
    "fastmcp>=2.0",
    "jsonschema>=4.23",
    "langchain-aws>=0.2",
    "langchain-core>=0.3",
    "langfuse>=5.2",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.setuptools.packages.find]
include = ["novaops*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
